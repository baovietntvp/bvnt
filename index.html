  <style>
    :root {
      --navy: #102A43;
      --navy-2: #1C3A5E;
      --navy-3: #196BB4;
      --navy-4: #003b7a;
      --gold: #B8862B;
      --gold-2: #D7A94D;
      --gold-3: #dda307;
      --gold-4: #f6b508;
      --parchment: #FAF6EE;
      --paper: #FFFFFF;
      --ink: #1B2733;
      --slate: #5C6B7A;
      --line: #E4DCC8;
      --teal: #2F6F62;
      --terracotta: #B5562D;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(16, 42, 67, .06), 0 4px 16px rgba(16, 42, 67, .06);
    }

    * {
      box-sizing: border-box;
    }

    /* select {
      -webkit-appearance: none;
      appearance: none;
    } */

    body {
      margin: 0;
      background: var(--parchment);
      color: var(--ink);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    select {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }

    h1,
    h2,
    h3 {
      /* font-family: "Georgia", "Times New Roman", serif; */
      font-weight: 700;
      margin: 0;
      line-height: 1.15;
      font-size: 1.08rem;
    }

    /* GATE */
    #gate {
      position: fixed;
      inset: 0;
      /* background: var(--navy); */
      display: flex;
      align-items: center;
      justify-content: flex-start;
      z-index: 999;
      background: url('images/background_pc.jpg') center center / cover no-repeat, linear-gradient(135deg, #0B2F63 0%, #175AAB 55%, #3E86D1 100%);
    }

    .gate-box {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 72px 32px;
      max-width: 460px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      margin-left: 10%;
      box-shadow: 0 8px 32px rgba(100, 180, 230, 1);
    }

    @media (max-width: 768px) {
    #gate {
      background: url('images/background_sp3.jpg') center center / cover no-repeat, linear-gradient(160deg, #0B2F63 0%, #175AAB 60%, #3E86D1 100%);
      justify-content: center;
    }

    .gate-box {
      width: 85%;
      margin-left: 0;
      padding: 30px 32px;
    }
  }

    .gate-box h1 {
      font-size: 25px;
      color: white;
      margin-bottom: 6px;
    }

    .gate-box p {
      color: white;
      font-size: 16px;
      margin: 0 0 20px;
    }

    .gate-box input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 16px;
      text-align: center;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .gate-box button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--gold-3);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    .gate-box button:hover {
      background: var(--gold-2);
    }

    .gate-error {
      display: none;
      color: var(--terracotta);
      font-size: 13px;
      margin-top: 8px;
    }

    /* HEADER */
    .app-header {
      background: var(--navy-3);
      color: #fff;
      padding: 14px 16px 12px;
    }

    .app-banner {
      max-width: 1040px;
      margin: auto;
      padding: 0;
    }

    @media screen and (min-width: 640px) {
      .app-banner {
        padding: 0 20px;
      }
    }

    .app-banner img {
      height: 100%;
      width: 100%;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      color: transparent;
      object-position: center;
      object-fit: cover;
      max-width: 100%;
      display: block;
    }

    .app-header .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      max-width: 1040px;
      margin: 0 auto;
      flex-wrap: wrap;
    }

    .app-header .brand h1 {
      font-size: 19px;
      color: #fff;
    }

    .app-header .brand .tag {
      font-size: 12px;
      color: var(--gold-4);
      letter-spacing: .04em;
      font-weight: 800;
    }

    /* STEPS */
    #steps {
      display: flex;
      align-items: center;
      max-width: 1040px;
      margin: 20px auto 0;
      padding: 0 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      justify-content: center;
    }

    #steps::-webkit-scrollbar {
      display: none;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      opacity: .25;
      flex-shrink: 0;

      justify-content: center;
    }

    .step.active,
    .step.done {
      opacity: 1;
    }

    // ============ ENGINE LOGIC ============
    function sarRatio(age) { const t = [0.2, 0.4, 0.6, 0.8]; return age < 4 ? t[age] : 1.0; }
    function feeRateCoBan(n) {
      if (n === 1) return 0.5;
      if (n === 2) return 0.3;
      if (n >= 3 && n <= 5) return 0.2;
      if (n >= 6 && n <= 10) return 0.02;
      return 0;
    }
    function feeRateDongThem(n) { return n <= 10 ? 0.015 : 0; }
    function mgmtFeeMonthly(calYear) { return Math.min(30000 + (calYear - 2026) * 1000, 70000); }
    function terminationFeeRate(n) { const t = { 1: 1.0, 2: 0.8, 3: 0.45, 4: 0.4, 5: 0.2 }; return t[n] ?? 0; }
    function minGuaranteedRate(n) {
      if (n === 1) return 0.025;
      if (n === 2) return 0.02;
      if (n === 3) return 0.015;
      if (n >= 4 && n <= 10) return 0.01;
      return 0.005;
    }
    // Tỷ lệ lãi suất cam kết gia tăng (Lãi gia tăng đầu tư) theo PDF — chỉ áp dụng khi rateMode='min'
    function bonusInterestRate(n) {
      if (n === 1) return 0.02;
      if (n >= 2 && n <= 3) return 0.015;
      if (n >= 4 && n <= 15) return 0.01;
      if (n >= 16 && n <= 20) return 0.0025;
      return 0;
    }
    function duyTriRate(n) { if (n === 5) return 0.02; if (n === 10) return 0.04; if (n === 15) return 0.06; return 0.08; }
    function addMonths(d, n) { const r = new Date(d); r.setMonth(r.getMonth() + n); return r; }
    function annualRateForYear(mode, n) {
      if (mode === '476') return 0.0476;
      if (mode === '425') return 0.0425;
      return minGuaranteedRate(n);
    }
    function rateAt(table, age) { const i = Math.min(Math.max(age, 0), table.length - 1); return table[i] || 0; }

    // Tuổi tối đa của thời hạn bảo vệ từng sản phẩm bổ trợ (theo PhiSPBK: phí giảm về 0 tại tuổi này;
    // R22 không có bảng phí theo tuổi nên áp dụng cùng mốc với R23 theo xác nhận của Trí).
    const RIDER_MAX_AGE = { R21: 74, R22: 69, R23: 69, R25: 74, R26: 70, R29: 69 };

    // Hệ số điều chỉnh phí theo Nhóm nghề nghiệp (1-6), áp dụng riêng cho R22 và R23
    // theo '1.NĐBH'!F10,F11 (VLOOKUP PhiSPBK!P5:Q11 / P5:R11). Hệ số 0 = không nhận bảo hiểm nhóm đó.
    const NHOM_FACTOR_R22 = { 1: 1, 2: 1.3, 3: 1.9, 4: 2.5, 5: 0, 6: 0 };
    const NHOM_FACTOR_R23 = { 1: 1, 2: 1.3, 3: 1.9, 4: 2.5, 5: 3.5, 6: 0 };

    function riderPremiumForAge(rider, age, gender, nhom) {
      const maxAge = RIDER_MAX_AGE[rider.type];
      if (maxAge !== undefined && age > maxAge) return 0;
      const a = Math.min(Math.max(age, 0), 95);
      switch (rider.type) {
        case 'R29': {
          const base = gender === 'Nam' ? PHISPBK.r29_nam[a] : PHISPBK.r29_nu[a];
          return base * (rider.stbh / PHISPBK.r29_base);
        }
        case 'R21': {
          const base = gender === 'Nam' ? PHISPBK.r21_nam[a] : PHISPBK.r21_nu[a];
          return base * (rider.stbh / PHISPBK.r21_base);
        }
        case 'R25': {
          const base = gender === 'Nam' ? PHISPBK.r25_nam[a] : PHISPBK.r25_nu[a];
          return base * (rider.stbh / PHISPBK.r25_base);
        }
        case 'R22': {
          const factor = NHOM_FACTOR_R22[nhom || 1] ?? 0;
          return PHISPBK.r22_phi_co_ban * factor * (rider.stbh / PHISPBK.r22_base);
        }
        case 'R23': {
          const factor = NHOM_FACTOR_R23[nhom || 1] ?? 0;
          return PHISPBK.r23_phi[a] * factor * (rider.stbh / PHISPBK.r23_base);
        }
        case 'R26': {
          const map = { bac: 'r26_bac', vang: 'r26_vang', bachkim: 'r26_bachkim', kimcuong: 'r26_kimcuong', lucbao: 'r26_lucbao' };
          const raw = PHISPBK[map[rider.tier]][a] || 0;
          return raw * 1000;
        }
      }
      return 0;
    }

    function runEngine(inputs, rateMode) {
      const rateTable = inputs.gender === 'Nam' ? PHISPC.nam : PHISPC.nu;
      let age = inputs.initialAge;
      let curDate = new Date(inputs.startDate);
      let Jprev = 0;
      let L = 0, M = 0, N = 0;
      let bonusAccum = 0; // Lãi gia tăng đầu tư tích lũy — chỉ áp dụng khi rateMode='min', chỉ cộng vào GTTK Cơ bản
      const Jhist = [], Hhist = [];
      const yearly = [];
      let cumSPC = 0, cumSPBK = 0;

      for (let n = 1; n <= inputs.term; n++) {
        const annualRate = annualRateForYear(rateMode, n);
        const monthlyRate = Math.pow(1 + annualRate, 1 / 12) - 1;
        const paying = n <= inputs.paymentYears;
        const investedCoBan = paying ? inputs.phiCoBan * (1 - feeRateCoBan(n)) : 0;
        const investedDongThem = paying ? inputs.phiDongThem * (1 - feeRateDongThem(n)) : 0;

        let annualPhiRR = 0;
        for (let m = 1; m <= 12; m++) {
          if (m === 1) {
            if (n > 1) age += 1;
            Jprev = Jprev + investedCoBan;
          }
          const ratio = sarRatio(age);
          const sar = Math.max(inputs.stbhChinh * ratio - Jprev, 0);
          const rate = rateAt(rateTable, age);
          const phiM = rate * sar / 1000 / 12;
          annualPhiRR += phiM;
          const fee = mgmtFeeMonthly(curDate.getFullYear());
          Jprev = (Jprev - phiM - fee) * (1 + monthlyRate);
          Jhist.push(Jprev);
          Hhist.push(phiM);
          curDate = addMonths(curDate, 1);
        }

        M = (M + investedDongThem) * (1 + annualRate);

        let newDuyTri = 0, newHoanPhi = 0;
        const eligible = inputs.paymentYears >= n;
        if (n % 5 === 0 && eligible) {
          const windowJ = Jhist.slice(Jhist.length - 60);
          const avgJ = windowJ.reduce((a, b) => a + b, 0) / windowJ.length;
          newDuyTri = duyTriRate(n) * avgJ;
          if (n === 5) {
            newHoanPhi = 0.5 * Hhist.slice(0, 60).reduce((a, b) => a + b, 0);
          } else if (n === 10) {
            newHoanPhi = 1.0 * Hhist.slice(60, 120).reduce((a, b) => a + b, 0);
          }
        }
        const effRateForBonusPool = rateMode === 'min' ? (annualRate + bonusInterestRate(n)) : annualRate;
        L = L * (1 + effRateForBonusPool) + newDuyTri;
        N = N * (1 + effRateForBonusPool) + newHoanPhi;

        const GTTKCoBanBase = Math.max(Jprev, 0);
        if (rateMode === 'min') {
          bonusAccum = bonusAccum * (1 + annualRate) + GTTKCoBanBase * bonusInterestRate(n);
        }
        const GTTKCoBan = GTTKCoBanBase + bonusAccum;
        const GTTKDongThem = L + M + N;
        const GTTKHD = GTTKCoBan + GTTKDongThem;
        const QLBHTuVong = Math.max(GTTKCoBan, inputs.stbhChinh) + GTTKDongThem;
        const phiChamDut = terminationFeeRate(n) * inputs.phiCoBan;
        const giaTriHoanLai = Math.max(GTTKHD - phiChamDut, 0);

        let riderPremiumYear = 0;
        for (const r of inputs.riders) riderPremiumYear += riderPremiumForAge(r, age, inputs.gender, inputs.nhomNgheNghiep);
        cumSPBK += riderPremiumYear;
        const premiumThisYear = paying ? (inputs.phiCoBan + inputs.phiDongThem) : 0;
        cumSPC += premiumThisYear;

        yearly.push({
          year: n, age, premiumThisYear, cumSPC,
          QLBHTuVong, thuongCombined: L + N,
          newBonusThisYear: newDuyTri + newHoanPhi,
          bonusMilestoneEligible: (n % 5 === 0 && eligible),
          GTTKCoBan, GTTKDongThem, GTTKHD, giaTriHoanLai,
          riderPremiumYear, cumSPBK,
          tongLuyKe: cumSPC + cumSPBK,
          chenhLech: GTTKHD - (cumSPC + cumSPBK)
        });
      }
      return yearly;
    }

      product: { stbhChinh: '', phiCoBan: '', phiDongThem: '0', termMode: '20', paymentYears: 10 },
      riders: {},
      results: null
    };
    RIDER_DEFS.forEach(r => state.riders[r.type] = { enabled: false, stbh: '', tier: 'bac' });

    // ============ STBH LIMIT RULES (theo sheet 1.NĐBH cột H,I và PhiSPC cột O,P,Q) ============
    const MAXSTBH = {
      nam: [100, 100, 100, 100, 100, 100, 100, 100, 100, 95, 95, 95, 90, 90, 90, 85, 85, 85, 80, 80, 80, 80, 75, 75, 75, 75, 70, 70, 70, 65, 65, 65, 65, 60, 60, 60, 55, 55, 55, 55, 50, 50, 50, 45, 45, 45, 45, 40, 40, 40, 40, 35, 35, 35, 30, 30, 30, 30, 25, 25, 25, 25, 25, 20, 20, 20],
      nu: [100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 95, 95, 95, 90, 90, 90, 85, 85, 85, 80, 80, 80, 75, 75, 75, 70, 70, 70, 65, 65, 65, 60, 60, 60, 55, 55, 55, 55, 50, 50, 50, 45, 45, 45, 40, 40, 40, 40, 35, 35, 35, 30, 30, 30]
    };
    function maxStbhMultiplier(age, gender) {
      const arr = gender === 'Nam' ? MAXSTBH.nam : MAXSTBH.nu;
      const idx = Math.min(Math.max(age, 0), arr.length - 1);
      return arr[idx];
    }
    // ============ BẢNG GIỚI HẠN NHẬP LIỆU (sửa số tại đây — mọi gợi ý & kiểm tra đều đọc từ bảng này) ============
    const LIMITS = {
      tuoi: { min: 0, max: 65 },
      phiCoBan: { min: 6000000 },                                  // không giới hạn tối đa
      stbhChinh: { min: 50000000, minHeSoPhi: 5, max: 25000000000 }, // tối đa theo tuổi: hệ số MAXSTBH × phí
      phiDongThem: { min: 1000000, maxHeSoPhi: 5 },                // 0 = không đóng thêm
      thoiHanDongPhi: { min: 4 },                                  // tối đa = thời hạn hợp đồng
      R21: { min: 100000000, max: 3000000000 },
      R25: { min: 100000000, maxDuoi18: 1000000000, maxTu18: 3000000000 },
      R22: { min: 100000000, max: 500000000, nhomKhongNhan: [5, 6] },
      R23: { min: 100000000, maxTheoNhom: { 1: 5000000000, 2: 5000000000, 3: 5000000000, 4: 5000000000, 5: 300000000 }, nhomKhongNhan: [6] },
      R29: {
        min: 100000,
        bacPhi: [ [100000000, 2000000], [50000000, 1000000], [30000000, 500000], [10000000, 300000] ], // [phí cơ bản từ, STBH tối đa]
        maxDuoi18: 300000, maxTu18: 2000000
      },
      R26: [ [50000000, 'lucbao'], [30000000, 'kimcuong'], [20000000, 'bachkim'], [10000000, 'vang'], [5000000, 'bac'] ] // [phí cơ bản từ, hạng tối đa]
    };
    const fmtTrieu = n => n >= 1e9 ? (n / 1e9).toLocaleString('vi-VN') + ' tỷ' : (n >= 1e6 ? (n / 1e6).toLocaleString('vi-VN') + ' triệu' : fmtMoney(n) + ' đ');

    function stbhChinhLimits(phiCoBan, age, gender) {
      if (!phiCoBan || age === null) return null;
      const L = LIMITS.stbhChinh;
      const heSo = maxStbhMultiplier(age, gender);
      const min = Math.max(L.min, L.minHeSoPhi * phiCoBan);
      const maxTheoTuoi = heSo * phiCoBan;
      const max = Math.min(maxTheoTuoi, L.max);
      return {
        min, max,
        minReason: min === L.min ? null : `${L.minHeSoPhi} lần phí cơ bản`,
        maxReason: max === L.max ? null : `${heSo} lần phí cơ bản với NĐBH ${gender === 'Nam' ? 'nam' : 'nữ'} ${age} tuổi`
      };
    }
    function phiDongThemMaxLimit(phiCoBan) {
      if (!phiCoBan) return null;
      return { min: LIMITS.phiDongThem.min, max: LIMITS.phiDongThem.maxHeSoPhi * phiCoBan };
    }
    // Trả về { min, max, maxReason } | { notAllowed: 'nhom'|'phi' } | null (chưa đủ dữ liệu)
    function riderStbhLimits(riderType, age, phiCoBan, stbhChinh) {
      const nhom = state.customer.nhomNgheNghiep;
      const capBy = (caps) => { // caps: [[giá trị, lý do], ...] → lấy mức nhỏ nhất
        const c = caps.reduce((a, b) => (b[0] < a[0] || (b[0] === a[0] && !a[1] && b[1]) ? b : a));
        return { max: c[0], maxReason: c[1] };
      };
      const stbhCap = [stbhChinh, 'không vượt STBH sản phẩm chính'];
      if (riderType === 'R21') {
        if (!stbhChinh) return null;
        return { min: LIMITS.R21.min, ...capBy([stbhCap, [LIMITS.R21.max, null]]) };
      }
      if (riderType === 'R25') {
        if (!stbhChinh || age === null) return null;
        const L = LIMITS.R25;
        const cap = age < 18 ? [L.maxDuoi18, 'áp dụng cho NĐBH dưới 18 tuổi'] : [L.maxTu18, null];
        return { min: L.min, ...capBy([stbhCap, cap]) };
      }
      if (riderType === 'R22') {
        const L = LIMITS.R22;
        if (L.nhomKhongNhan.includes(nhom)) return { notAllowed: 'nhom' };
        if (!stbhChinh) return null;
        return { min: L.min, ...capBy([stbhCap, [L.max, null]]) };
      }
      if (riderType === 'R23') {
        const L = LIMITS.R23;
        if (L.nhomKhongNhan.includes(nhom) || !L.maxTheoNhom[nhom]) return { notAllowed: 'nhom' };
        if (!stbhChinh) return null;
        return { min: L.min, ...capBy([stbhCap, [L.maxTheoNhom[nhom], `áp dụng cho Nhóm nghề ${nhom}`]]) };
      }
      if (riderType === 'R29') {
        if (!phiCoBan || age === null) return null;
        const L = LIMITS.R29;
        const bac = L.bacPhi.find(b => phiCoBan >= b[0]);
        if (!bac) return { notAllowed: 'phi' };
        const caps = [[bac[1], `theo mức phí cơ bản ${fmtMoney(phiCoBan)} đ`]];
        caps.push(age >= 18 ? [L.maxTu18, null] : [L.maxDuoi18, 'áp dụng cho NĐBH dưới 18 tuổi']);
        return { min: L.min, ...capBy(caps) };
      }
      return null;
    }
    const R26_TIER_ORDER = ['KHÔNG', 'Bạc', 'Vàng', 'Bạch Kim', 'Kim Cương', 'Lục Bảo'];
    const R26_KEY_ORDER = ['bac', 'vang', 'bachkim', 'kimcuong', 'lucbao'];
    function r26MaxTierKey(phiCoBan) {
      const b = LIMITS.R26.find(x => phiCoBan >= x[0]);
      return b ? b[1] : null;
    }
    function r26TierRange(phiCoBan) {
      if (!phiCoBan) return null;
      const maxKey = r26MaxTierKey(phiCoBan);
      if (!maxKey) return { minTier: 'KHÔNG', maxTier: 'KHÔNG' };
      return { minTier: 'Bạc', maxTier: R26_TIER_ORDER[R26_KEY_ORDER.indexOf(maxKey) + 1] };
    }
    function resolvedTerm() {
      if (state.product.termMode === 'den90') {
        return state.customer.age !== null ? Math.max(90 - state.customer.age, 1) : null;
      }
      return Number(state.product.termMode);

    function daysInMonth(month, year) {
      if (!month) return 31;
      const y = year || 2000;
      return new Date(y, Number(month), 0).getDate();

    // ============ HELPERS ============
    function fmtMoney(n) {
      if (n === null || n === undefined || isNaN(n)) return '0';

    function fmtMoneyTh(n) { return fmtMoney(n / 1000); } // hiển thị theo nghìn đồng cho bảng minh họa
    function parseNum(str) {
      if (!str) return 0;
      return Number(String(str).replace(/[.,\s]/g, '')) || 0;
    }
    function attachThousandFormatter(input) {
      input.addEventListener('input', (e) => {
        const cursorFromEnd = input.value.length - input.selectionStart;
        let raw = input.value.replace(/[^\d]/g, '');
        input.value = raw ? Number(raw).toLocaleString('vi-VN') : '';
        const pos = Math.max(input.value.length - cursorFromEnd, 0);
        input.setSelectionRange(pos, pos);
      });

    function calcAge(day, month, year, today) {
      if (!day || !month || !year) return null;
      const dob = new Date(Number(year), Number(month) - 1, Number(day));
      let age = today.getFullYear() - dob.getFullYear();
      const hadBday = (today.getMonth() > dob.getMonth()) || (today.getMonth() === dob.getMonth() && today.getDate() >= dob.getDate());

      return age;

    function stbhHintHtml(lim) {

                  <select class="rider-input" data-rider-tier="${r.type}" ${st.enabled ? '' : 'disabled'}>
                    ${R26_TIERS.map(t => `<option value="${t.key}" ${st.tier === t.key ? 'selected' : ''}>${t.label} (${t.limit})</option>`).join('')}
                  </select>
                </div>

              </div>
              ${st.enabled ? `<div class="hint" id="hint-rider-R26">${tierRange ? `Hạng mức cho phép theo phí cơ bản: <b>${tierRange.minTier}</b> – <b>${tierRange.maxTier}</b>.` : 'Nhập Phí bảo hiểm cơ bản để xem hạng mức cho phép.'}</div>` : ''}

      const lim = riderStbhLimits(r.type, age, phiCoBan, stbhChinh);
      return `

            <input type="checkbox" data-rider="${r.type}" class="rider-toggle" ${st.enabled ? 'checked' : ''}>

          </label>
          <div class="rider-input-col">
            <div class="rider-input-row">
              <div class="input-with-icon">
                <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAyNCAyNCc+PGcgc3Ryb2tlPScjMUIyNzMzJyBzdHJva2Utd2lkdGg9JzInIHN0cm9rZS1saW5lY2FwPSdyb3VuZCcgc3Ryb2tlLWxpbmVqb2luPSdyb3VuZCcgZmlsbD0nbm9uZSc+PGNpcmNsZSBjeD0nMTAuNScgY3k9JzEzLjUnIHI9JzQuMicvPjxwYXRoIGQ9J00xNC43IDMuNXYxNC41TTEyIDYuNWg1LjVNNiAyMS41aDEyJy8+PC9nPjwvc3ZnPg==" alt="" class="input-icon">
                <input type="text" inputmode="numeric" class="rider-input" data-rider-stbh="${r.type}" placeholder="${r.placeholder}" value="${st.stbh}" ${st.enabled ? '' : 'disabled'}>
              </div>
              ${st.enabled ? `<span class="rider-fee" id="fee-rider-${r.type}">${riderFeeHtml(r, st)}</span>` : ''}
            </div>
            ${st.enabled ? `<div class="hint" id="hint-rider-${r.type}">${riderHintHtml(r.type, lim)}</div>` : ''}
          </div>
        </div>`;
    }
    function riderHintHtml(type, lim) {
      if (!lim) return type === 'R29'
        ? 'Nhập Phí bảo hiểm cơ bản và Ngày sinh để xem giới hạn STBH.'
        : 'Nhập Số tiền bảo hiểm (Sản phẩm chính) để xem giới hạn STBH.';
      if (lim.notAllowed) return '⚠️ Phí bảo hiểm cơ bản chưa đủ điều kiện tham gia sản phẩm này.';
      let extra = '';
      const nhom = state.customer.nhomNgheNghiep;
      if (type === 'R22' && NHOM_FACTOR_R22[nhom] === 0) extra = ' ⚠️ Nhóm nghề này không được nhận bảo hiểm R22.';
      if (type === 'R23' && NHOM_FACTOR_R23[nhom] === 0) extra = ' ⚠️ Nhóm nghề này không được nhận bảo hiểm R23.';
      return `STBH: <b>${fmtMoney(lim.min)}</b> – <b>${fmtMoney(lim.max)} đ</b>${extra}`;
    }

    function bindPage1Events() {
      document.getElementById('f-name').addEventListener('input', e => state.customer.name = e.target.value);

      const dobEl = document.getElementById('f-dob');
      dobEl.addEventListener('input', () => {
        let digits = dobEl.value.replace(/[^\d]/g, '').slice(0, 8);
        let formatted = digits;
        if (digits.length > 4) formatted = digits.slice(0, 2) + '/' + digits.slice(2, 4) + '/' + digits.slice(4);
        else if (digits.length > 2) formatted = digits.slice(0, 2) + '/' + digits.slice(2);
        dobEl.value = formatted;
        state.customer.dobStr = formatted;
        const m = formatted.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
        if (m) {
          const day = +m[1], month = +m[2], year = +m[3];
          const valid = month >= 1 && month <= 12 && day >= 1 && day <= daysInMonth(month, year);
          state.customer.age = valid ? calcAge(day, month, year, new Date()) : null;
        } else {
          state.customer.age = null;
        }
        const hintEl = document.getElementById('age-hint');
        if (hintEl) {
          hintEl.innerHTML = state.customer.age !== null
            ? `Tuổi được bảo hiểm: <b>${state.customer.age}</b> (ngày tham gia: ${new Date().toLocaleDateString('vi-VN')})`
            : (formatted.length === 10 ? '⚠️ Ngày sinh không hợp lệ.' : 'Nhập đầy đủ ngày/tháng/năm sinh theo định dạng dd/mm/yyyy để tính tuổi.');
        }
        refreshHints();
      });

      document.querySelectorAll('.seg-btn').forEach(b => {
        b.addEventListener('click', () => { state.customer.gender = b.dataset.g; renderPage1(); });
      });
      document.getElementById('f-nhom').addEventListener('change', e => {
        state.customer.nhomNgheNghiep = Number(e.target.value);
        refreshHints();
      });
      ['f-stbh', 'f-phicoban', 'f-phidongthem'].forEach(id => {
        const el = document.getElementById(id);
        attachThousandFormatter(el);
        el.addEventListener('input', () => {
          if (id === 'f-stbh') state.product.stbhChinh = el.value;
          if (id === 'f-phicoban') state.product.phiCoBan = el.value;
          if (id === 'f-phidongthem') state.product.phiDongThem = el.value;
          refreshHints();
        });
      });
      document.getElementById('f-term').addEventListener('change', e => { state.product.termMode = e.target.value; renderPage1(); });
      document.getElementById('f-payyears').addEventListener('input', e => { state.product.paymentYears = Number(e.target.value); refreshHints(); });

      document.querySelectorAll('.rider-toggle').forEach(cb => {
        cb.addEventListener('change', () => {
          state.riders[cb.dataset.rider].enabled = cb.checked;
          renderPage1();
        });
      });
      document.querySelectorAll('[data-rider-stbh]').forEach(inp => {
        attachThousandFormatter(inp);
        inp.addEventListener('input', () => { state.riders[inp.dataset.riderStbh].stbh = inp.value; inp.classList.remove('input-error'); refreshHints(); });
      });
      document.querySelectorAll('[data-rider-tier]').forEach(sel => {
        sel.addEventListener('change', () => { state.riders[sel.dataset.riderTier].tier = sel.value; sel.classList.remove('input-error'); refreshHints(); });
      });

      document.getElementById('btn-go-page2').addEventListener('click', () => {
        if (!validatePage1()) return;
        computeResults();
        state.page = 2;
        renderAll();
      });

      // Lỗi "dưới mức tối thiểu" chỉ báo khi đã rời khỏi ô (tránh báo đỏ khi đang gõ dở)
      const root = document.getElementById('page-root');
      if (!root._touchBound) {
        root._touchBound = true;
        root.addEventListener('focusout', e => {
          const k = fieldKeyOf(e.target);
          if (k && state.page === 1) { touched[k] = true; refreshHints(); }
        });
      }

      refreshHints();
    }

    // ============ KIỂM TRA GIỚI HẠN TỪNG Ô ============
    const touched = {};
    function fieldKeyOf(el) {
      if (!el) return null;
      if (el.dataset && el.dataset.riderStbh) return 'rider-' + el.dataset.riderStbh;
      if (el.dataset && el.dataset.riderTier) return 'rider-' + el.dataset.riderTier;
      return ['f-dob', 'f-phicoban', 'f-phidongthem', 'f-stbh', 'f-payyears'].includes(el.id) ? el.id : null;
    }
    const FIELD_DOM = {
      'f-dob': ['#f-dob', '#age-hint'],
      'f-phicoban': ['#f-phicoban', '#hint-phicoban'],
      'f-phidongthem': ['#f-phidongthem', '#hint-phidongthem'],
      'f-stbh': ['#f-stbh', '#hint-stbh-chinh'],
      'f-payyears': ['#f-payyears', '#hint-payyears']
    };
    RIDER_DEFS.forEach(r => {
      FIELD_DOM['rider-' + r.type] = [r.type === 'R26' ? '[data-rider-tier="R26"]' : `[data-rider-stbh="${r.type}"]`, '#hint-rider-' + r.type];
    });

    // kind: 'empty' (chỉ báo khi bấm nút) | 'min' (báo khi rời ô) | 'max' / 'other' (báo ngay khi nhập)
    function evalFields() {
      const age = state.customer.age;
      const gender = state.customer.gender;
      const nhom = state.customer.nhomNgheNghiep;
      const phiCoBan = parseNum(state.product.phiCoBan);
      const stbhChinh = parseNum(state.product.stbhChinh);
      const phiDongThem = parseNum(state.product.phiDongThem);
      const term = resolvedTerm();
      const m = n => fmtMoney(n) + ' đ';
      const F = {};

      // Ngày sinh / tuổi
      {
        const T = LIMITS.tuoi;
        const f = F['f-dob'] = { hint: age !== null ? `Tuổi được bảo hiểm: <b>${age}</b> · Giới hạn: ${T.min} – ${T.max} tuổi` : `Giới hạn tuổi tham gia: ${T.min} – ${T.max} tuổi` };
        const dob = state.customer.dobStr || '';
        if (dob.length === 10 && age === null) { f.err = 'Ngày sinh không hợp lệ.'; f.kind = 'other'; }
        else if (age !== null && age < T.min) { f.err = 'Ngày sinh không được sau ngày tham gia.'; f.kind = 'other'; }
        else if (age !== null && age > T.max) { f.err = `NĐBH ${age} tuổi, vượt tuổi tham gia tối đa ${T.max} tuổi.`; f.kind = 'max'; }
        else if (age === null) { f.err = 'Vui lòng nhập ngày sinh (dd/mm/yyyy).'; f.kind = 'empty'; }
      }
      // Phí cơ bản
      const phiOk = phiCoBan >= LIMITS.phiCoBan.min;
      {
        const f = F['f-phicoban'] = { hint: '' };
        if (!phiCoBan) { f.err = 'Vui lòng nhập Phí bảo hiểm cơ bản.'; f.kind = 'empty'; }
        else if (!phiOk) { f.err = `Thấp hơn mức tối thiểu ${m(LIMITS.phiCoBan.min)}.`; f.kind = 'min'; }
      }
      // Phí đóng thêm
      {
        const lim = phiDongThemMaxLimit(phiCoBan);
        const f = F['f-phidongthem'] = { hint: lim ? `Giới hạn: <b>${m(lim.min)}</b> – <b>${m(lim.max)}</b>, hoặc 0` : `Giới hạn: từ ${m(LIMITS.phiDongThem.min)} đến ${LIMITS.phiDongThem.maxHeSoPhi} lần phí cơ bản, hoặc 0` };
        if (phiDongThem > 0) {
          if (phiDongThem < LIMITS.phiDongThem.min) { f.err = `Thấp hơn mức tối thiểu ${m(LIMITS.phiDongThem.min)} (để 0 nếu không đóng thêm).`; f.kind = 'min'; }
          else if (lim && phiDongThem > lim.max) { f.err = `Vượt mức tối đa ${m(lim.max)} (${LIMITS.phiDongThem.maxHeSoPhi} lần phí cơ bản).`; f.kind = 'max'; }
        }
      }
      // STBH chính
      {
        const lim = (phiOk && age !== null && age <= LIMITS.tuoi.max) ? stbhChinhLimits(phiCoBan, age, gender) : null;
        const f = F['f-stbh'] = { hint: lim ? `Giới hạn: <b>${m(lim.min)}</b> – <b>${m(lim.max)}</b>` : 'Nhập Phí bảo hiểm cơ bản và Ngày sinh để xem giới hạn.' };
        if (!stbhChinh) { f.err = 'Vui lòng nhập Số tiền bảo hiểm.'; f.kind = 'empty'; }
        else if (lim && stbhChinh < lim.min) { f.err = `Thấp hơn mức tối thiểu ${m(lim.min)}${lim.minReason ? ' (' + lim.minReason + ')' : ''}.`; f.kind = 'min'; }
        else if (lim && stbhChinh > lim.max) { f.err = `Vượt mức tối đa ${m(lim.max)}${lim.maxReason ? ' (' + lim.maxReason + ')' : ''}.`; f.kind = 'max'; }
        else if (!lim && stbhChinh > LIMITS.stbhChinh.max) { f.err = `Vượt mức tối đa ${fmtTrieu(LIMITS.stbhChinh.max)}.`; f.kind = 'max'; }
      }
      // Thời hạn đóng phí
      {
        const py = state.product.paymentYears;
        const f = F['f-payyears'] = { hint: term ? `Giới hạn: <b>${LIMITS.thoiHanDongPhi.min}</b> – <b>${term}</b> năm` : `Tối thiểu ${LIMITS.thoiHanDongPhi.min} năm, không quá thời hạn hợp đồng` };
        if (!py) { f.err = 'Vui lòng nhập Thời hạn đóng phí.'; f.kind = 'empty'; }
        else if (py < LIMITS.thoiHanDongPhi.min) { f.err = `Thấp hơn mức tối thiểu ${LIMITS.thoiHanDongPhi.min} năm.`; f.kind = 'min'; }
        else if (term && py > term) { f.err = `Vượt thời hạn hợp đồng (${term} năm).`; f.kind = 'max'; }
      }
      // Sản phẩm bán kèm
      RIDER_DEFS.forEach(r => {
        const st = state.riders[r.type];
        if (!st.enabled) return;
        const key = 'rider-' + r.type;
        if (r.type === 'R26') {
          const tr = r26TierRange(phiCoBan);
          const f = F[key] = { hint: tr ? `Hạng cho phép: <b>${tr.minTier}</b> – <b>${tr.maxTier}</b>` : 'Nhập Phí bảo hiểm cơ bản để xem hạng cho phép.' };
          if (age !== null && age > RIDER_MAX_AGE.R26) { f.err = `NĐBH vượt tuổi tối đa ${RIDER_MAX_AGE.R26} tuổi.`; f.kind = 'other'; return; }
          if (!phiCoBan) return;
          const maxKey = r26MaxTierKey(phiCoBan);
          if (!maxKey) { f.err = 'Phí cơ bản chưa đủ điều kiện tham gia.'; f.kind = 'other'; }
          else if (R26_KEY_ORDER.indexOf(st.tier) > R26_KEY_ORDER.indexOf(maxKey)) {
            f.err = `Phí cơ bản ${m(phiCoBan)} chỉ được chọn tối đa hạng ${tr.maxTier}.`; f.kind = 'max';
          }
          return;
        }
        const lim = riderStbhLimits(r.type, age, phiCoBan, stbhChinh);
        const v = parseNum(st.stbh);
        const f = F[key] = {};
        if (lim && lim.notAllowed === 'nhom') { f.hint = ''; f.err = `Không nhận bảo hiểm Nhóm nghề ${nhom}.`; f.kind = 'other'; return; }
        if (lim && lim.notAllowed === 'phi') { f.hint = ''; f.err = `Phí cơ bản tối thiểu ${m(LIMITS.R29.bacPhi[LIMITS.R29.bacPhi.length - 1][0])} mới tham gia được.`; f.kind = 'other'; return; }
        f.hint = lim ? `Giới hạn: <b>${m(lim.min)}</b> – <b>${m(lim.max)}</b>`
          : (r.type === 'R29' ? 'Nhập Phí bảo hiểm cơ bản và Ngày sinh để xem giới hạn.' : 'Nhập Số tiền bảo hiểm (Sản phẩm chính) để xem giới hạn.');
        if (age !== null && RIDER_MAX_AGE[r.type] !== undefined && age > RIDER_MAX_AGE[r.type]) { f.err = `NĐBH vượt tuổi tối đa ${RIDER_MAX_AGE[r.type]} tuổi.`; f.kind = 'other'; return; }
        if (!v) { f.err = 'Vui lòng nhập Số tiền bảo hiểm, hoặc bỏ chọn sản phẩm này.'; f.kind = 'empty'; return; }
        if (!lim) return;
        if (lim.min > lim.max) { f.err = `STBH sản phẩm chính phải từ ${m(lim.min)} trở lên mới tham gia được.`; f.kind = 'other'; }
        else if (v < lim.min) { f.err = `Thấp hơn mức tối thiểu ${m(lim.min)}.`; f.kind = 'min'; }
        else if (v > lim.max) { f.err = `Vượt mức tối đa ${m(lim.max)}${lim.maxReason ? ' (' + lim.maxReason + ')' : ''}.`; f.kind = 'max'; }
      });
      return F;
    }

    // Vẽ gợi ý giới hạn + báo đỏ vào từng ô. Trả về danh sách key đang lỗi (đã tính cả lỗi ẩn).
    function applyFieldStates(forceAll) {
      const F = evalFields();
      const failing = [];
      Object.keys(FIELD_DOM).forEach(key => {
        const [inSel, hintSel] = FIELD_DOM[key];
        const inEl = document.querySelector(inSel);
        const hintEl = document.querySelector(hintSel);
        const f = F[key];
        if (!f) { if (inEl) inEl.classList.remove('input-error'); return; }
        if (f.err) failing.push(key);
        const show = f.err && (forceAll || f.kind === 'max' || f.kind === 'other' || (f.kind === 'min' && touched[key]));
        if (inEl) inEl.classList.toggle('input-error', !!show);
        if (hintEl) hintEl.innerHTML = (f.hint || '') + (show ? `<div class="hint-error">⚠️ ${f.err}</div>` : '');
      });
      return { F, failing };
    }

    function refreshHints() {
      const phiCoBan = parseNum(state.product.phiCoBan);
      const savingEl = document.getElementById('hint-daily-saving');
      if (savingEl) savingEl.innerHTML = phiCoBan ? `Tiết kiệm: <b>${fmtMoney(Math.round(phiCoBan / 365))} đồng/ngày</b>` : '';
      RIDER_DEFS.forEach(r => {
        const feeEl = document.getElementById('fee-rider-' + r.type);
        if (feeEl) feeEl.innerHTML = riderFeeHtml(r, state.riders[r.type]);
      });
      applyFieldStates(!!state.submitTried);
      updateTotalFirstYear();
    }

    function updateTotalFirstYear() {
      const el = document.getElementById('f-total-first-year');
      if (!el) return;
      const phiCoBan = parseNum(state.product.phiCoBan) || 0;
      const phiDongThem = parseNum(state.product.phiDongThem) || 0;
      const riderTypes = ['R21', 'R22', 'R23', 'R25', 'R26', 'R29'];
      let riderTotal = 0;
      riderTypes.forEach(type => {
        const r = state.riders[type];
        if (!r || !r.enabled) return;
        const riderInput = type === 'R26' ? { type, tier: r.tier } : { type, stbh: parseNum(r.stbh) };
        riderTotal += riderPremiumForAge(riderInput, state.customer.age, state.customer.gender, state.customer.nhomNgheNghiep);
      });

      const total = phiCoBan + phiDongThem + riderTotal;
      el.textContent = total > 0 ? '₫ ' + fmtMoney(total) : '';
    }

    function validatePage1() {
      state.submitTried = true;
      const { F, failing } = applyFieldStates(true);
      const banner = document.getElementById('form-errors');
      if (failing.length) {
        const LABEL = { 'f-dob': 'Ngày sinh', 'f-phicoban': 'Phí cơ bản', 'f-phidongthem': 'Phí đóng thêm', 'f-stbh': 'STBH sản phẩm chính', 'f-payyears': 'Thời hạn đóng phí' };
        banner.innerHTML = failing.map(k => '• ' + (LABEL[k] || k.replace('rider-', '')) + ': ' + F[k].err).join('<br>');
        banner.style.display = 'block';
        const first = document.querySelector(FIELD_DOM[failing[0]][0]);
        (first || banner).scrollIntoView({ behavior: 'smooth', block: 'center' });
        return false;
      }
      banner.style.display = 'none';
      return true;
    }

    // ============ COMPUTE ============

        if (type === 'R26') { riders.push({ type, tier: r.tier }); }
        else { riders.push({ type, stbh: parseNum(r.stbh) }); }
      });
      const inputs = {
        gender: state.customer.gender,
        initialAge: state.customer.age,
        nhomNgheNghiep: state.customer.nhomNgheNghiep,
        stbhChinh: parseNum(state.product.stbhChinh),
        phiCoBan: parseNum(state.product.phiCoBan),
        phiDongThem: parseNum(state.product.phiDongThem),
        term: resolvedTerm(),
        paymentYears: state.product.paymentYears,
        startDate: todayISO(),
        riders
      };
      state.results = {
        '476': runEngine(inputs, '476'),
        '425': runEngine(inputs, '425'),
        'min': runEngine(inputs, 'min')
      };
      state.lastInputs = inputs;

    function loadHeaderImage() {
      return new Promise(resolve => {
        let done = false;
        const finish = v => { if (!done) { done = true; resolve(v); } };
        const img = new Image();
        img.onload = () => finish(img);
        img.onerror = () => finish(null);
        img.src = HEADER_IMG_DATAURI;
        setTimeout(() => finish(null), 1200);
      });
    }

    function expDrawRoundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function expWrapText(ctx, text, maxWidth) {
      const paragraphs = String(text).split('\n');
      const lines = [];
      paragraphs.forEach(para => {
        const words = para.split(' ');
        let cur = '';
        words.forEach(w => {
          const test = cur ? cur + ' ' + w : w;
          if (ctx.measureText(test).width > maxWidth && cur) { lines.push(cur); cur = w; }
          else cur = test;
        });
        lines.push(cur);
      });
      return lines;
    }

    function buildExportModel() {
      const inputs = state.lastInputs;
      let riderTotal = 0;
      inputs.riders.forEach(r => { riderTotal += riderPremiumForAge(r, inputs.initialAge, inputs.gender, inputs.nhomNgheNghiep); });
      const tongPhiNam1 = (inputs.phiCoBan || 0) + (inputs.phiDongThem || 0) + riderTotal;
      return {
        name: state.customer.name || 'Khách hàng',
        age: inputs.initialAge,
        gender: inputs.gender === 'Nam' ? 'Nam' : 'Nữ',
        nhom: inputs.nhomNgheNghiep,
        phiCoBan: inputs.phiCoBan,
        tongPhiNam1,
        term: inputs.term,
        paymentYears: inputs.paymentYears,
        sections: buildBenefitSections()
      };
    }

    // Vẽ toàn bộ bảng tóm tắt lên ctx bắt đầu từ y=0, trả về tổng chiều cao (logical px, chưa nhân DPR)
    // Vẽ 1 khung tiêu đề mục lớn: nền xanh dương, chữ vàng đồng — dùng chung cho mục 1 & mục 2
    function drawMainSectionBar(ctx, x, y, w, text, h) {
      ctx.fillStyle = EXP.navyDeep;
      ctx.fillRect(x, y, w, h);
      ctx.font = '700 17px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = EXP.bronze;
      ctx.textBaseline = 'middle';
      ctx.fillText(text, x + 16, y + h / 2 + 1);
      ctx.textBaseline = 'alphabetic';
      return h;
    }

    // Vẽ 1 cặp "Nhãn: Giá trị" trên cùng 1 dòng, trả về true baseline width dùng nếu cần
    function drawLabelValueInline(ctx, x, y, label, value) {
      ctx.font = '400 12px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = EXP.slate;
      ctx.fillText(label + ':', x, y);
      const labelW = ctx.measureText(label + ': ').width;
      ctx.font = '700 13px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = EXP.navy;
      ctx.fillText(value, x + labelW + 4, y);
    }

    // ---- Khối dùng chung cho mọi loại ảnh xuất ----
    function drawHeaderBlock(ctx, W, headerImg) {
      if (headerImg) {
        const headerH = Math.round(W * (headerImg.height / headerImg.width));
        ctx.drawImage(headerImg, 0, 0, W, headerH);
        return headerH;
      }
      // fallback nếu ảnh không tải được
      ctx.fillStyle = EXP.goldBar;
      ctx.fillRect(0, 0, W, 8);
      ctx.fillStyle = EXP.white;
      ctx.fillRect(0, 8, W, 60);
      ctx.font = '700 20px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = EXP.navy;
      ctx.fillText('MINH HỌA QUYỀN LỢI', 32, 44);
      return 68;
    }

    function drawCustomerInfoBlock(ctx, PAD, CW, W, y, model, rowOverrides) {
      const bar1H = drawMainSectionBar(ctx, PAD, y, CW, '1. THÔNG TIN KHÁCH HÀNG', 34);
      y += bar1H + 10;

      const colW = CW / 2;
      const infoRows = [
        ['Họ và tên', model.name, 'Phí cơ bản/năm', fmtMoney(model.phiCoBan) + ' đ'],
        ['Tuổi NĐBH', model.age + ' tuổi', 'Tổng phí BH năm 1', fmtMoney(model.tongPhiNam1) + ' đ'],
        ['Giới tính', model.gender, 'Thời hạn hợp đồng', model.term + ' năm'],
        ['Nhóm nghề', 'Nhóm ' + model.nhom, 'Thời hạn đóng phí', model.paymentYears + ' năm']
      ];
      if (rowOverrides) {
        Object.keys(rowOverrides).forEach(idx => { infoRows[idx] = rowOverrides[idx]; });
      }
      // Đo bề rộng nhãn dài nhất mỗi cột để giá trị luôn thẳng hàng theo cột
      ctx.font = '400 15.5px "Segoe UI", Arial, sans-serif';
      const leftLabelW = Math.max(...infoRows.map(r => ctx.measureText(r[0] + ':').width));
      const rightLabelW = Math.max(...infoRows.map(r => ctx.measureText(r[2] + ':').width));
      const valueX1 = PAD + leftLabelW + 10;
      const valueX2 = PAD + colW + rightLabelW + 10;

      const rowH = 24;
      infoRows.forEach((row, i) => {
        const ry = y + i * rowH;
        ctx.font = '400 15.5px "Segoe UI", Arial, sans-serif';
        ctx.fillStyle = EXP.ink;
        ctx.fillText(row[0] + ':', PAD, ry + 17);
        ctx.fillText(row[2] + ':', PAD + colW, ry + 17);
        ctx.font = '700 16px "Segoe UI", Arial, sans-serif';
        ctx.fillStyle = EXP.navy;
        ctx.fillText(row[1], valueX1, ry + 17);
        ctx.fillText(row[3], valueX2, ry + 17);
        if (i < infoRows.length - 1) {
          ctx.strokeStyle = EXP.line;
          ctx.beginPath(); ctx.moveTo(PAD, ry + rowH); ctx.lineTo(W - PAD, ry + rowH); ctx.stroke();
        }
      });
      return y + infoRows.length * rowH + 10;
    }

    function drawFooterBlock(ctx, W, PAD, CW, y) {
      const footerText = 'Công cụ tham khảo nội bộ, tài liệu minh họa chính thức do Bảo Việt Nhân thọ phát hành.';
      ctx.font = 'italic 400 12px "Segoe UI", Arial, sans-serif';
      const footerLines = expWrapText(ctx, footerText, CW - 16);
      ctx.fillStyle = EXP.slate;
      ctx.textAlign = 'center';
      y += 3;
      footerLines.forEach((line, li) => ctx.fillText(line, W / 2, y + 12 + li * 16));
      ctx.textAlign = 'left';
      return y + footerLines.length * 16 + 10;
    }

    function paintSummary(ctx, W, model, headerImg) {
      const PAD = 32;
      const CW = W - PAD * 2;
      let y = 0;

      y = drawHeaderBlock(ctx, W, headerImg);
      y += 8;
      y = drawCustomerInfoBlock(ctx, PAD, CW, W, y, model);

      // ---- Mục 2: Tóm tắt quyền lợi bảo hiểm ----
      const bar2H = drawMainSectionBar(ctx, PAD, y, CW, '2. TÓM TẮT QUYỀN LỢI BẢO HIỂM', 34);
      y += bar2H + 8;

      model.sections.forEach(sec => {
        // Header phụ
        const secHeaderH = sec.note ? 36 : 26;
        ctx.fillStyle = EXP.sectionBg;
        ctx.fillRect(PAD, y, CW, secHeaderH);
        ctx.fillStyle = EXP.goldBar;
        ctx.fillRect(PAD, y, 3, secHeaderH);
        ctx.textBaseline = 'middle';
        ctx.font = '700 15px "Segoe UI", Arial, sans-serif';
        ctx.fillStyle = EXP.navyDeep;
        if (sec.note) {
          ctx.fillText(sec.title, PAD + 14, y + secHeaderH / 2 - 8);
          ctx.font = 'italic 400 12px "Segoe UI", Arial, sans-serif';
          ctx.fillStyle = EXP.slate;
          ctx.fillText(sec.note, PAD + 14, y + secHeaderH / 2 + 9);
        } else {
          ctx.fillText(sec.title, PAD + 14, y + secHeaderH / 2 + 1);
        }
        ctx.textBaseline = 'alphabetic';
        y += secHeaderH + 4;

        sec.rows.forEach(r => {
          const labelWeight = r.isBold ? '700' : '400';
          ctx.font = '700 15.5px "Segoe UI", Arial, sans-serif';
          const valueText = r.text ? r.text : fmtMoney(r.value) + ' đ';
          const valueWidth = ctx.measureText(valueText).width;
          const labelMaxWidth = CW - valueWidth - 24;

          ctx.font = labelWeight + ' 15.5px "Segoe UI", Arial, sans-serif';
          const labelLines = expWrapText(ctx, r.label, labelMaxWidth);

          const labelLineH = 19;
          const noteLineH = 15;
          let noteLines = [];
          let contentH = labelLines.length * labelLineH;
          if (r.note) {
            ctx.font = 'italic 400 12.5px "Segoe UI", Arial, sans-serif';
            noteLines = expWrapText(ctx, r.note, labelMaxWidth);
            contentH += 2 + noteLines.length * noteLineH;
          }

          const padV = 5;
          const rowHeight = Math.max(contentH, labelLineH) + padV * 2;

          ctx.textBaseline = 'top';
          let ty = y + (rowHeight - contentH) / 2;
          ctx.font = labelWeight + ' 15.5px "Segoe UI", Arial, sans-serif';
          ctx.fillStyle = EXP.ink;
          labelLines.forEach(line => { ctx.fillText(line, PAD + 6, ty); ty += labelLineH; });
          if (r.note) {
            ctx.font = 'italic 400 12.5px "Segoe UI", Arial, sans-serif';
            ctx.fillStyle = EXP.slate;
            ty += 2;
            noteLines.forEach(line => { ctx.fillText(line, PAD + 6, ty); ty += noteLineH; });
          }

          ctx.font = '700 15.5px "Segoe UI", Arial, sans-serif';
          ctx.fillStyle = EXP.navy;
          ctx.textAlign = 'right';
          ctx.fillText(valueText, W - PAD - 6, y + (rowHeight - labelLineH) / 2);
          ctx.textAlign = 'left';
          ctx.textBaseline = 'alphabetic';

          ctx.strokeStyle = EXP.line;
          ctx.beginPath(); ctx.moveTo(PAD, y + rowHeight); ctx.lineTo(W - PAD, y + rowHeight); ctx.stroke();
          y += rowHeight;
        });
        y += 5;
      });

      y = drawFooterBlock(ctx, W, PAD, CW, y);
      return y;
    }

    async function renderSummaryCanvas() {
      const model = buildExportModel();
      const headerImg = await loadHeaderImage();
      const W = 800;
      const DPR = 2; // độ phân giải cao cho rõ nét trên điện thoại & khi in

      // Bước 1: đo chiều cao thực tế cần thiết
      const measureCanvas = document.createElement('canvas');
      measureCanvas.width = W; measureCanvas.height = 10;
      const measureCtx = measureCanvas.getContext('2d');
      const H = Math.ceil(paintSummary(measureCtx, W, model, headerImg));

      // Bước 2: vẽ thật lên canvas đúng kích thước
      const canvas = document.createElement('canvas');
      canvas.width = W * DPR;
      canvas.height = H * DPR;
      const ctx = canvas.getContext('2d');
      ctx.scale(DPR, DPR);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
      paintSummary(ctx, W, model, headerImg);

      return canvas;
    }

    // ============ EXPORT: ẢNH MINH HỌA SẢN PHẨM CHÍNH (bảng năm-qua-năm) ============
    function buildIllustrationModel() {
      const inputs = state.lastInputs;

      inputs.riders.forEach(r => { riderTotal += riderPremiumForAge(r, inputs.initialAge, inputs.gender, inputs.nhomNgheNghiep); });
      const tongPhiNam1 = (inputs.phiCoBan || 0) + (inputs.phiDongThem || 0) + riderTotal;

        age: inputs.initialAge,
        gender: inputs.gender === 'Nam' ? 'Nam' : 'Nữ',
        nhom: inputs.nhomNgheNghiep,
        phiCoBan: inputs.phiCoBan,
        tongPhiNam1,
        term: inputs.term,
        paymentYears: inputs.paymentYears,
        rows: state.results['476']
      };
    }

    function paintIllustration(ctx, W, model, headerImg) {
      const PAD = 32;
      const CW = W - PAD * 2;
      let y = 0;

      y = drawHeaderBlock(ctx, W, headerImg);
      y += 8;
      y = drawCustomerInfoBlock(ctx, PAD, CW, W, y, model, {
        1: ['Tuổi NĐBH', model.age + ' tuổi', 'Lãi suất minh họa', '4,76%']
      });

      // ---- Mục 2: Minh họa sản phẩm chính ----
      const bar2H = drawMainSectionBar(ctx, PAD, y, CW, '2. MINH HỌA SẢN PHẨM CHÍNH', 34);
      y += bar2H + 10;

      // 4 cột: Năm HĐ/Tuổi | Tổng phí BH lũy kế | Thưởng duy trì & hoàn phí rủi ro | Giá trị tài khoản HĐ — độ rộng bằng nhau
      const col0W = CW / 4;
      const col1W = CW / 4;
      const col2W = CW / 4;
      const col3W = CW / 4;
      const x0 = PAD, x1 = PAD + col0W, x2 = x1 + col1W, x3 = x2 + col2W;
      const colCenters = [x0 + col0W / 2 + 6, x1 + col1W / 2, x2 + col2W / 2, x3 + col3W / 2];
      const tableTopY = y;

      // Header bảng — nền navy, chữ trắng, cỡ chữ bằng cỡ chữ giá trị mục 1 (16px)
      const headRowH = 48;
      ctx.fillStyle = EXP.navy;
      ctx.fillRect(PAD, y, CW, headRowH);
      ctx.font = '700 16px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const headLabels = ['Năm HĐ / Tuổi', 'Tổng phí BH\nlũy kế', 'Thưởng duy trì\n& hoàn phí rủi ro', 'Giá trị tài khoản\nhợp đồng'];
      headLabels.forEach((label, i) => {
        const lines = label.split('\n');
        const startY = y + headRowH / 2 - (lines.length - 1) * 9;
        lines.forEach((line, li) => ctx.fillText(line, colCenters[i], startY + li * 18));
      });
      ctx.textBaseline = 'alphabetic';
      y += headRowH;

      // Các dòng dữ liệu — mỗi năm 1 dòng, mốc 5 năm tô đậm màu vàng nhạt
      const rowH = 32;
      model.rows.forEach((r, i) => {
        const isMilestone = r.year % 5 === 0;
        ctx.fillStyle = isMilestone ? '#F3DFAE' : (i % 2 === 1 ? '#FBF9F2' : '#FFFFFF');
        ctx.fillRect(PAD, y, CW, rowH);

        ctx.font = (isMilestone ? '700 ' : '400 ') + '16px "Segoe UI", Arial, sans-serif';
        ctx.fillStyle = isMilestone ? EXP.navy : EXP.ink;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(r.year + ' / Tuổi ' + r.age, colCenters[0], y + rowH / 2);
        ctx.fillText(fmtMoneyTh(r.cumSPC), colCenters[1], y + rowH / 2);
        ctx.fillText(r.bonusMilestoneEligible ? fmtMoneyTh(r.newBonusThisYear) : '—', colCenters[2], y + rowH / 2);
        ctx.fillText(fmtMoneyTh(r.GTTKHD), colCenters[3], y + rowH / 2);
        ctx.textBaseline = 'alphabetic';
        ctx.textAlign = 'left';

        ctx.strokeStyle = EXP.line;
        ctx.beginPath(); ctx.moveTo(PAD, y + rowH); ctx.lineTo(W - PAD, y + rowH); ctx.stroke();
        y += rowH;
      });

      // Đường phân cách dọc giữa 4 cột — giúp khoảng cách giữa các cột cân đối, rõ ràng
      ctx.strokeStyle = EXP.line;
      [x1, x2, x3].forEach(xLine => {
        ctx.beginPath(); ctx.moveTo(xLine, tableTopY); ctx.lineTo(xLine, y); ctx.stroke();
      });

      // Viền ngoài bảng
      ctx.strokeStyle = EXP.line;
      ctx.strokeRect(PAD, y - (headRowH + model.rows.length * rowH), CW, headRowH + model.rows.length * rowH);

      y += 10;
      ctx.font = 'italic 400 10.5px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = EXP.slate;
      ctx.fillText('Đơn vị: nghìn đồng.', PAD, y + 10);
      y += 24;

      y = drawFooterBlock(ctx, W, PAD, CW, y);
      return y;
    }

    function isIOS() {
      // Phát hiện iPhone/iPad, kể cả iPad đời mới báo user-agent giống macOS
      return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    // Phát hiện trình duyệt nhúng bên trong app (Zalo, Facebook, Messenger, Instagram, Zing, TikTok...).
    // Các trình duyệt này (WebView riêng của app, không phải Safari/Chrome thật) thường CHẶN hoặc
    // không hỗ trợ tải file/mở tab mới — không có cách nào khắc phục hoàn toàn bằng code, cách duy
    // nhất là hướng dẫn người dùng mở link bằng trình duyệt thật (Safari/Chrome).
    function detectInAppBrowser() {
      const ua = navigator.userAgent || '';
      if (/Zalo/i.test(ua)) return 'Zalo';
      if (/FBAN|FBAV|FB_IAB/i.test(ua)) return 'Facebook/Messenger';
      if (/Instagram/i.test(ua)) return 'Instagram';
      if (/Line\//i.test(ua)) return 'Line';
      if (/MicroMessenger/i.test(ua)) return 'WeChat';
      if (/TikTok|musical_ly/i.test(ua)) return 'TikTok';
      // Trên iOS, Safari thật luôn có "Safari/" ở cuối user-agent; nhiều app nhúng WebView không có.
      if (/iPhone|iPad|iPod/.test(ua) && !/Safari\//.test(ua)) return 'ứng dụng đang mở link này';
      return null;
    }

    function copyCurrentUrl() {
      const url = window.location.href;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url);
          return true;
        }
      } catch (e) { /* rơi xuống cách dự phòng bên dưới */ }
      try {
        const ta = document.createElement('textarea');
        ta.value = url;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        return true;
      } catch (e) {
        return false;
      }
    }

    // Thử tự động mở Safari (iOS) hoặc Chrome (Android) bằng URL scheme đặc biệt —
    // kỹ thuật này được nhiều web Việt Nam dùng để thoát khỏi WebView của Zalo/Facebook.
    // KHÔNG đảm bảo hoạt động 100% với mọi phiên bản app — vẫn cần nút/hướng dẫn thủ công dự phòng.
    // target: 'safari' | 'chrome' | undefined (mặc định theo nền tảng).
    // Trên iOS: hỗ trợ chọn rõ Safari hoặc Chrome (nếu máy có cài Chrome).
    // Trên Android: luôn nhắm tới Chrome (trình duyệt phổ biến nhất).
    function tryOpenRealBrowser(target) {
      const url = window.location.href;
      if (isIOS()) {
        if (target === 'chrome') {
          const scheme = url.startsWith('https://') ? 'googlechromes://' : 'googlechrome://';
          const stripped = url.replace(/^https?:\/\//, '');
          window.location.href = scheme + stripped;
        } else {
          window.location.href = `x-safari-${url}`;
          setTimeout(() => { window.location.href = `com-apple-mobilesafari-tab:${url}`; }, 600);
        }
      } else {
        const stripped = url.replace(/^https?:\/\//, '');
        const fallback = encodeURIComponent(url);
        window.location.href = `intent://${stripped}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${fallback};end`;
      }
    }

    // Nếu đang mở trong trình duyệt riêng của 1 app (Zalo, Facebook...), cảnh báo NGAY
    // thay vì cố tải (vì hầu hết các WebView này chặn tải file/mở tab, không có cách
    // khắc phục triệt để bằng code — chỉ có thể hướng dẫn người dùng mở bằng trình duyệt thật).
    // Trả về true nếu đã cảnh báo (nên dừng lại, không thử tải nữa).
    function warnIfInAppBrowser() {
      const appName = detectInAppBrowser();
      if (!appName) return false;
      const copied = copyCurrentUrl();
      const goBrowser = confirm(
        `Bạn đang mở link này bên trong ${appName} — trình duyệt riêng của ứng dụng này thường KHÔNG tải được ảnh.\n\n` +
        `Bấm OK để thử tự động mở bằng Safari/Chrome. Nếu không tự mở được, hãy bấm "⋮"/"···" ở góc màn hình và chọn "Mở bằng trình duyệt khác".` +
        (copied ? '\n\n(Đã tự động sao chép link trang này — có thể dán trực tiếp vào Safari/Chrome nếu cần.)' : '')
      );
      if (goBrowser) tryOpenRealBrowser();
      return true;
    }

    async function dataUrlToBlob(dataUrl) {
      // Dùng fetch() để trình duyệt tự giải mã base64 bằng code gốc (native), nhanh hơn
      // đáng kể so với vòng lặp JS thủ công (atob + đọc từng byte), đặc biệt trên Safari.
      const res = await fetch(dataUrl);
      return await res.blob();
    }

    // Trả về 'ios-newtab' nếu đã xử lý theo cách mở tab mới (Safari iOS),
    // 'ios-blocked' nếu Safari đã chặn việc mở tab (cần bật popup thủ công),
    // 'downloaded' nếu đã tải bằng thẻ <a download> (Android/desktop).
    // preOpenedTab: tab đã được window.open('', '_blank') mở SẴN ngay khi bấm nút
    // (đồng bộ, trong lúc còn user-gesture) — bắt buộc với Safari/iOS.
    async function downloadDataUrl(dataUrl, filename, preOpenedTab) {
      const blob = await dataUrlToBlob(dataUrl);
      const blobUrl = URL.createObjectURL(blob);

      if (isIOS()) {
        // Safari trên iOS chặn window.open() nếu nó không được gọi đồng bộ ngay
        // trong lúc xử lý sự kiện bấm nút — nên tab phải được mở SẴN từ trước
        // (xem preOpenedTab). Ở đây KHÔNG điều hướng cả trang (location.href) vì
        // Safari có thể coi đó là 1 lượt tải trang mới trên tab nền và tạm dừng xử lý
        // cho tới khi người dùng chuyển qua tab đó — thay vào đó, ghi thẳng ảnh vào
        // DOM của tab đã mở sẵn (không có điều hướng nào xảy ra) để hiện ngay lập tức,
        // đồng thời chủ động gọi focus() để đưa tab đó lên trước.
        if (preOpenedTab && !preOpenedTab.closed) {
          try {
            preOpenedTab.document.open();
            preOpenedTab.document.write(
              '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
              '<meta name="viewport" content="width=device-width, initial-scale=1">' +
              '<title>' + filename + '</title></head>' +
              '<body style="margin:0;background:#e9edf1;text-align:center;font-family:\'Segoe UI\',Arial,sans-serif;">' +
              '<img src="' + blobUrl + '" style="max-width:100%;display:block;margin:0 auto;">' +
              '<div style="color:#5C6B7A;padding:14px;font-size:14px;">Nhấn giữ vào ảnh và chọn "Lưu vào Ảnh" để tải về.</div>' +
              '</body></html>'
            );
            preOpenedTab.document.close();
          } catch (e) {
            // Dự phòng nếu vì lý do nào đó không ghi được DOM trực tiếp
            preOpenedTab.location.href = blobUrl;
          }
          try { preOpenedTab.focus(); } catch (e) { /* bỏ qua nếu trình duyệt chặn focus() */ }
          setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
          return 'ios-newtab';
        }
        // Tab bị Safari chặn ngay từ đầu (hiếm khi xảy ra nếu mở đúng lúc bấm nút)
        setTimeout(() => URL.revokeObjectURL(blobUrl), 15000);
        return 'ios-blocked';
      }

      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
      return 'downloaded';
    }

    async function exportSummaryPNG(btn) {
      if (warnIfInAppBrowser()) return;
      const original = btn.textContent;
      // Mở tab trống NGAY LẬP TỨC, đồng bộ, trong lúc còn user-gesture —
      // bắt buộc với Safari/iOS, không được để bất kỳ await nào xen vào trước dòng này.
      const iosTab = isIOS() ? window.open('', '_blank') : null;
      if (iosTab) {
        iosTab.document.write('<title>Đang tạo ảnh...</title><body style="font-family:sans-serif;text-align:center;padding-top:40vh;color:#5C6B7A">Đang tạo ảnh, vui lòng đợi...</body>');
      }
      btn.disabled = true; btn.textContent = 'Đang tạo ảnh...';
      try {
        const canvas = await renderSummaryCanvas();
        const filename = `Quyền_Lợi_${(state.customer.name || 'khach_hang').replace(/\s+/g, '_')}.png`;
        const mode = await downloadDataUrl(canvas.toDataURL('image/png'), filename, iosTab);
        if (mode === 'ios-blocked') {
          alert('Safari đã chặn việc mở ảnh. Vào Cài đặt Safari > bật "Cho phép Popup" cho trang này, rồi thử lại.');
        }
      } catch (e) {
        if (iosTab && !iosTab.closed) iosTab.close();
        alert('Không thể tạo ảnh: ' + e.message);
      } finally {
        btn.disabled = false; btn.textContent = original;
      }
    }

    async function exportIllustrationPNG(btn) {
      if (warnIfInAppBrowser()) return;
      const original = btn.textContent;
      const iosTab = isIOS() ? window.open('', '_blank') : null;
      if (iosTab) {
        iosTab.document.write('<title>Đang tạo ảnh...</title><body style="font-family:sans-serif;text-align:center;padding-top:40vh;color:#5C6B7A">Đang tạo ảnh, vui lòng đợi...</body>');
      }
      btn.disabled = true; btn.textContent = 'Đang tạo ảnh...';
      try {
        const canvas = await renderIllustrationCanvas();
        const filename = `Minh_Họa_${(state.customer.name || 'khach_hang').replace(/\s+/g, '_')}.png`;
        const mode = await downloadDataUrl(canvas.toDataURL('image/png'), filename, iosTab);
        if (mode === 'ios-blocked') {
          alert('Safari đã chặn việc mở ảnh. Vào Cài đặt Safari > bật "Cho phép Popup" cho trang này, rồi thử lại.');
        }
      } catch (e) {
        if (iosTab && !iosTab.closed) iosTab.close();
        alert('Không thể tạo ảnh: ' + e.message);
      } finally {
        btn.disabled = false; btn.textContent = original;
      }
    }

    // ============ RENDER: PAGE 3 ============
    function renderPage3() {
      const root = document.getElementById('page-root');
      const sections = buildBenefitSections();
      root.innerHTML = `
  <div class="card">
    <h2 class="card-title">Tóm tắt quyền lợi bảo hiểm</h2>
    <div class="hint" style="margin-bottom:16px">${state.customer.name || 'Khách hàng'} · ${state.customer.gender === 'Nam' ? 'Nam' : 'Nữ'} · ${state.customer.age} tuổi</div>
    ${sections.map(renderBenefitSection).join('')}
    <div class="disclaimer-box">
      Công cụ tham khảo nội bộ, tài liệu minh họa chính thức do Bảo Việt Nhân thọ phát hành.
    </div>
  </div>
  ${detectInAppBrowser() ? `
  <div class="inapp-warning">
    ⚠️ Bạn đang mở trang này trong <strong>${detectInAppBrowser()}</strong> — trình duyệt riêng của ứng dụng này thường <strong>không tải được ảnh</strong>.
    Hãy bấm nút bên dưới để thử tự động mở Safari/Chrome, hoặc bấm "⋮" / "···" ở góc màn hình và chọn <strong>"Mở bằng trình duyệt khác"</strong>.
    <div style="margin-top:10px"><button class="btn btn-secondary" id="btn-open-real-browser" style="padding:8px 16px;font-size:13px">Thử mở bằng Safari/Chrome</button></div>
  </div>` : ''}
  <div class="actions">
    <button class="btn btn-secondary" id="btn-back-2">← Quay lại bảng minh họa</button>
    <button class="btn btn-green" id="btn-export-illustration">Tải ảnh minh họa</button>
    <button class="btn btn-blue" id="btn-export-png">Tải ảnh tóm tắt</button>
    <button class="btn btn-primary" id="btn-restart">Tạo minh họa mới</button>
  </div>
  `;
      document.getElementById('btn-export-illustration').addEventListener('click', (e) => exportIllustrationPNG(e.currentTarget));
      const openBrowserBtn = document.getElementById('btn-open-real-browser');
      if (openBrowserBtn) openBrowserBtn.addEventListener('click', () => { copyCurrentUrl(); tryOpenRealBrowser(); });
      document.getElementById('btn-export-png').addEventListener('click', (e) => exportSummaryPNG(e.currentTarget));
      document.getElementById('btn-back-2').addEventListener('click', () => { state.page = 2; renderAll(); });
      const restartBtn = document.getElementById('btn-restart');
      let restartArmed = false;
      restartBtn.addEventListener('click', () => {
        if (!restartArmed) {
          restartArmed = true;
          restartBtn.textContent = 'Bấm lần nữa để xác nhận xóa';
          restartBtn.classList.add('btn-danger-armed');
          setTimeout(() => { restartArmed = false; restartBtn.textContent = 'Tạo minh họa mới'; restartBtn.classList.remove('btn-danger-armed'); }, 4000);
          return;
        }
        location.reload();
      });
    }

    // ============ MAIN RENDER DISPATCH ============
    function renderAll() {
      renderSteps();
      if (state.page === 1) renderPage1();
      else if (state.page === 2) renderPage2();
      else if (state.page === 3) renderPage3();
      window.scrollTo(0, 0);
    }

    // Màn hình chặn đầu tiên khi phát hiện đang mở trong app (Zalo, Facebook, Messenger...) —
    // hiện TRƯỚC cả công cụ (trước màn hình mật khẩu), buộc người dùng xử lý trước khi vào công cụ.
    // Nút bấm chủ động (thay vì tự động chạy ngầm) đáng tin cậy hơn vì là hành động người dùng
    // trực tiếp — đặc biệt quan trọng với Safari/iOS vốn chỉ cho phép điều hướng ra ngoài khi có
    // thao tác bấm thật. Trả về true nếu đã chặn (chưa nên mở công cụ).
    function showInAppGate() {
      const appName = detectInAppBrowser();
      if (!appName) return false;

      const iosButtons = `
      <button id="gate-open-safari" style="width:100%;padding:15px;border:none;border-radius:30px;background:#175AAB;color:#fff;font-size:15.5px;font-weight:700;cursor:pointer;margin-bottom:10px;">Mở bằng Safari</button>
      <button id="gate-open-chrome" style="width:100%;padding:15px;border:1px solid #175AAB;border-radius:30px;background:#fff;color:#175AAB;font-size:15.5px;font-weight:700;cursor:pointer;margin-bottom:14px;">Mở bằng Chrome</button>`;
      const androidButtons = `
      <button id="gate-open-chrome" style="width:100%;padding:15px;border:none;border-radius:30px;background:#175AAB;color:#fff;font-size:15.5px;font-weight:700;cursor:pointer;margin-bottom:14px;">Mở bằng Chrome</button>`;

      const overlay = document.createElement('div');
      overlay.id = 'inapp-gate-overlay';
      overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0B3A66;display:flex;align-items:center;justify-content:center;padding:24px;';
      overlay.innerHTML = `
    <div style="max-width:420px;width:100%;background:#fff;border-radius:16px;padding:32px 24px;text-align:center;font-family:'Segoe UI',Arial,sans-serif;box-shadow:0 10px 40px rgba(0,0,0,0.3);">
      <div style="font-size:42px;margin-bottom:14px;line-height:1;">⚠️</div>
      <div style="font-size:18px;font-weight:700;color:#102A43;margin-bottom:10px;">Bạn đang mở link trong ${appName}</div>
      <div style="font-size:14px;color:#5C6B7A;line-height:1.6;margin-bottom:22px;">
        Trình duyệt riêng của ${appName} không hỗ trợ tải ảnh. Vui lòng mở bằng trình duyệt thật để tiếp tục sử dụng công cụ.
      </div>
      ${isIOS() ? iosButtons : androidButtons}
      <div style="font-size:12px;color:#8A97A6;line-height:1.6;">
        Nếu bấm nút trên mà không tự chuyển (ví dụ chưa cài trình duyệt đó), hãy bấm biểu tượng "⋮" / "···" ở góc màn hình và chọn "Mở bằng trình duyệt khác".
      </div>
    </div>`;
      document.body.appendChild(overlay);

      const safariBtn = document.getElementById('gate-open-safari');
      if (safariBtn) safariBtn.addEventListener('click', () => { copyCurrentUrl(); tryOpenRealBrowser('safari'); });
      document.getElementById('gate-open-chrome').addEventListener('click', () => { copyCurrentUrl(); tryOpenRealBrowser('chrome'); });
      return true;
    }

    document.addEventListener('DOMContentLoaded', () => {
      try {
        const blocked = showInAppGate();
        if (!blocked) {
          initGate();
          renderAll();
        }
      } catch (e) {
        document.body.innerHTML = '<div style="padding:24px;font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;color:#B5562D">Đã xảy ra lỗi khi tải công cụ: ' + e.message + '<br><br>Vui lòng thử mở lại bằng Chrome/Safari, hoặc liên hệ quản trị viên.</div>';
        console.error(e);
      }
    });

  </script>
</body>
</html>
